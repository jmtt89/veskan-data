# Reconstruccion nocturna de los snapshots.
#
# Tres decisiones de diseno que conviene entender antes de tocar esto:
#
# 0. Los catalogos de mas de 80 MB se parten en VARIOS SQLite completos, por
#    rango de codigo de barras. GitHub rechaza cualquier archivo de mas de
#    100 MB, asi que Estados Unidos (154 MB) era directamente impublicable y
#    tumbaba la publicacion entera. Cada parte es una base funcional con su
#    indice de texto; el cliente sabe en cual buscar por el rango, sin abrir las
#    demas. Los cortes se CONGELAN entre noches (se leen de la generacion
#    anterior con --prev): recalcularlos mudaria filas de archivo y el delta
#    diario dejaria de ser un diff de filas.
#
# 1. Se genera UNA BASE POR PAIS (--split), no una sola con todos. Un SQLite
#    comprime un 71% por la red, asi que la base entera de Venezuela son 0,3 MB:
#    menos que dos consultas por rangos. Descargarla completa sale mas barato Y
#    funciona sin conexion, que es justo donde mas falta hace. Solo paises
#    grandes como Espana (~70 MB comprimidos) siguen necesitando rangos.
#
# 2. El resultado se publica en la rama huerfana `data`, reemplazada entera con
#    --force. Un binario regenerado a diario anadiria su tamano integro al
#    historial en cada commit (los binarios no admiten delta): en un ano el
#    repositorio seria ingobernable.
#
# 3. Los deltas diarios se calculan AQUI, comparando el snapshot recien
#    construido con el publicado la noche anterior. NO se usan los deltas que
#    publica Open Food Facts en data/delta/: comprobado sobre dos de ellos
#    separados doce dias, el campo `nutriments` viene vacio en el 100% de los
#    registros, mientras que en el volcado completo lo trae relleno el 62%.
#    Aplicarlos borraria energia, azucares, grasas y sal de cada producto
#    actualizado.
#
# 4. Se sirve desde raw.githubusercontent.com y NO desde GitHub Pages, porque
#    Pages comprime con gzip y aplica los rangos HTTP al flujo comprimido. El
#    navegador recibia bytes que no eran del archivo y SQLite respondia
#    SQLITE_CORRUPT. Con curl no se reproducia: curl no pide compresion.
name: Construir snapshots

on:
  schedule:
    # 04:20 UTC: despues de que Open Food Facts publique su volcado nocturno.
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Paises separados por comas'
        default: 'spain,mexico,colombia,venezuela,argentina,chile,peru,united-states'
      mode:
        description: 'dump (completo, 12 GB en streaming) o api (rapido, parcial)'
        default: 'dump'

permissions:
  # Escritura porque el resultado se empuja a la rama `data`.
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Medido en local: recorrer el volcado entero lleva algo mas de una hora.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Traer la generacion anterior
        run: |
          # La rama `data` se reemplaza entera en cada reconstruccion, asi que
          # la version anterior solo existe en el remoto hasta que la pisemos.
          # Hace falta para calcular el delta Y para arrastrar el historial de
          # deltas, que si no desapareceria con el --force.
          if git fetch --depth=1 origin data 2>/dev/null; then
            mkdir -p prev
            # `git archive` y no `git checkout --work-tree`: este ultimo deja el
            # indice apuntando a la rama `data`, y el commit posterior saldria
            # con lo que no toca.
            git archive FETCH_HEAD | tar -x -C prev
            echo "Generacion anterior:"
            ls -la prev/ | head -20
          else
            echo "No hay rama 'data' todavia: primera publicacion, sin deltas."
          fi

      - name: Construir los snapshots
        env:
          MODE: ${{ inputs.mode || 'dump' }}
          # Estados Unidos entra porque en Latinoamerica los importados
          # estadounidenses son habituales: medido, el 19,3% del catalogo
          # mexicano y el 13,8% del venezolano llevan prefijo GS1 de EE.UU.
          COUNTRIES: ${{ inputs.countries || 'spain,mexico,colombia,venezuela,argentina,chile,peru,united-states' }}
        run: |
          set -o pipefail
          mkdir -p out
          if [ "$MODE" = "dump" ]; then
            # El volcado JSONL pesa 12 GB comprimidos y el runner solo tiene
            # ~14 GB libres: guardarlo en disco dejaria la maquina al limite.
            # Se transmite directamente al parser, sin almacenar nada.
            # --max-per-country acota los catalogos grandes a los productos
            # mas escaneados. Estados Unidos tiene ~970.000 productos en Open
            # Food Facts, que a 250 B serian 231 MB: por encima del limite de
            # 100 MB por archivo de GitHub. Se conservan los 300.000 mas
            # populares (~75 MB), que es donde esta practicamente todo lo que
            # alguien escanea de verdad.
            curl -fsSL --retry 3 --retry-delay 30 \
              https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz \
              | node scripts/build-db.mjs --mode=dump --stdin \
                  --countries="$COUNTRIES" --split --out-dir=out --prev=prev \
                  --max-per-country=united-states:300000,spain:380000
          else
            node scripts/build-db.mjs --mode=api \
              --countries="$COUNTRIES" --split --out-dir=out --prev=prev
          fi

      - name: Calcular los deltas del dia
        run: |
          # --verify aplica cada delta sobre una copia del snapshot anterior y
          # comprueba que reproduce el nuevo FILA A FILA. Si no, aborta sin
          # publicar: un delta mal calculado no falla en el navegador, deja el
          # catalogo del usuario con datos que no corresponden a ninguna version
          # y la siguiente comprobacion lo dara por al dia. Comprobarlo aqui
          # cuesta unos segundos por pais.
          node scripts/build-delta.mjs --old=prev --new=out --keep=14 --verify

      - name: Comprobar que el resultado es razonable
        run: |
          test -f out/index.json || { echo "::error::No se genero el indice."; exit 1; }
          cat out/index.json
          n=0
          for f in out/*.sqlite3; do
            size=$(stat -c%s "$f")
            echo "$(basename "$f"): $size bytes"
            # Si la descarga o el filtrado fallaron, los archivos salen
            # minusculos. Abortar conserva los anteriores, que funcionaban.
            # Ningun archivo puede superar los 100 MB: git lo rechaza en el push
            # y el Action fallaria despues de una hora de trabajo.
            #
            # Con los catalogos grandes partidos en varios SQLite esto no
            # deberia dispararse. Si lo hace, es que una parte crecio por encima
            # del margen: hay que bajar MAX_PART_BYTES en build-db.mjs, lo que
            # obligara a repartir ese pais y a que sus usuarios lo descarguen de
            # nuevo (las filas cambian de archivo).
            if [ "$size" -gt 104857600 ]; then
              echo "::error::$(basename "$f") supera los 100 MB ($size B), git lo rechazaria."
              echo "::error::Baja MAX_PART_BYTES en scripts/build-db.mjs para partirlo en mas trozos."
              exit 1
            fi
            if [ "$size" -lt 20000 ]; then
              echo "::error::$(basename "$f") sospechosamente pequeno ($size B)."
              exit 1
            fi
            # Un archivo truncado puede pesar lo suficiente y no ser legible,
            # asi que se comprueba la cabecera ademas del tamano.
            head -c 15 "$f" | grep -q "SQLite format 3" \
              || { echo "::error::$(basename "$f") no es un SQLite valido."; exit 1; }
            n=$((n+1))
          done
          [ "$n" -gt 0 ] || { echo "::error::No se genero ninguna base."; exit 1; }
          echo "$n bases verificadas."

      - name: Publicar en la rama 'data'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-tmp
          git rm -rf --cached . >/dev/null
          mv out/*.sqlite3 out/index.json ./
          # Los deltas solo existen a partir de la segunda reconstruccion.
          [ -d out/deltas ] && mv out/deltas ./ || true
          rm -rf out prev
          printf '%s\n' \
            '# Rama `data`' '' \
            'Una base SQLite por pais, mas `index.json` con sus tamanos.' \
            'La rama se reemplaza entera en cada reconstruccion para que el' \
            'historial no acumule binarios. El codigo vive en `main`.' '' \
            'Los paises pequenos se descargan enteros y funcionan sin conexion;' \
            'los grandes se consultan por rangos HTTP. El cliente lo decide' \
            'leyendo `index.json`.' '' \
            'En `deltas/<pais>/<version>.jsonl.gz` van las actualizaciones' \
            'incrementales: un cliente con el catalogo de ayer se pone al dia' \
            'con kilobytes en vez de volver a bajarse decenas de megas.' \
            'Se calculan comparando dos generaciones del snapshot, no con los' \
            'deltas de Open Food Facts, que vienen sin datos nutricionales.' '' \
            'Se sirven desde raw.githubusercontent.com porque GitHub Pages' \
            'comprime los archivos y eso rompe las peticiones Range.' '' \
            'Datos de Open Food Facts bajo licencia ODbL-1.0.' \
            > README.md
          # El -f es OBLIGATORIO y no es un descuido: `.gitignore` excluye
          # *.sqlite3 para que nadie suba por error un snapshot generado en
          # local a la rama `main`. Aqui, en cambio, subirlos es justo el
          # objetivo. Sin -f, git los ignora en silencio y se publicaria una
          # rama vacia despues de una hora de trabajo.
          git add -f ./*.sqlite3 index.json README.md
          [ -d deltas ] && git add -f deltas || true

          # Red de seguridad frente a ese fallo silencioso: si alguien quita el
          # -f "limpiando", esto lo detiene aqui en lugar de dejar la rama sin
          # datos y la aplicacion sin snapshot.
          staged=$(git diff --cached --name-only | grep -c '\.sqlite3$' || true)
          echo "Archivos .sqlite3 preparados para el commit: $staged"
          if [ "$staged" -eq 0 ]; then
            echo "::error::Ningun .sqlite3 llego al commit. ¿Se perdio el -f de git add?"
            exit 1
          fi

          git commit -m "Snapshots $(date -u +%Y-%m-%d) (${{ inputs.mode || 'dump' }})"
          git push --force origin data-tmp:data
